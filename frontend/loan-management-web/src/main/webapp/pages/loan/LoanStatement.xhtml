<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">Loan statement</ui:define>
    <ui:define name="content">
        <h:form>
        <div class="page-header">
            <div>
                <h1>Loan statement</h1>
                <p>Repayments, payroll deductions, penalties and running balance.</p>
            </div>
            <p:commandButton value="Print" icon="pi pi-print" type="button" onclick="window.print()"/>
        </div>
        <p:dataTable value="#{repaymentView.records}" var="payment">
            <p:column headerText="Date">#{payment.paymentDate}</p:column>
            <p:column headerText="Reference">#{payment.paymentReference}</p:column>
            <p:column headerText="Amount">#{payment.amount}</p:column>
            <p:column headerText="Status">#{payment.status}</p:column>
        </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
