<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">RepaymentScheduleItem | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>RepaymentScheduleItem</h1>
                    <p>View and manage repaymentscheduleitem records.</p>
                </div>
            </div>
            <p:messages id="messages" showDetail="true" closable="true"/>
            <div class="table-filters">
                <i class="pi pi-search"/>
                <p:inputText id="globalFilter" placeholder="Search records" onkeyup="PF('table_repaymentScheduleItem').filter()"/>
            </div>
            <p:dataTable id="table" globalFilterOnly="true" widgetVar="table_repaymentScheduleItem" value="#{repaymentScheduleItemView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Installment">
                    <h:outputText value="#{row.installmentNumber}"/>
                </p:column>
                <p:column headerText="Due date">
                    <h:outputText value="#{row.dueDate}"/>
                </p:column>
                <p:column headerText="Expected">
                    <h:outputText value="#{row.expectedAmount}"/>
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{row.status}"/>
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton icon="pi pi-trash" rendered="#{componentRenderer.hasPermission('REPAYMENT_SCHEDULE_DELETE')}" title="Delete" styleClass="ui-button-danger ui-button-outlined" action="#{repaymentScheduleItemView.delete(row)}" update="@form"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
