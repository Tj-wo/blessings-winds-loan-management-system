<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/dialog-template.xhtml">
    <ui:define name="dialog-content">
        <h:form id="dialogForm">
            <p:messages showDetail="true"/>
            <div class="dialog-header">
                <h2>#{repaymentFormDialog.editing ? 'Edit Repayment' : 'New Repayment'}</h2>
            </div>
            <div class="form-grid">
                <div class="field">
                    <p:outputLabel for="amount" value="Amount"/>
                    <p:inputNumber id="amount" value="#{repaymentFormDialog.model.amount}" decimalPlaces="2"/>
                </div>

                <div class="field">
                    <p:outputLabel for="paymentReference" value="Payment reference"/>
                    <p:inputText id="paymentReference" value="#{repaymentFormDialog.model.paymentReference}"/>
                </div>
            </div>
            <div class="dialog-actions">
                <p:commandButton value="Cancel" icon="pi pi-times" type="button" onclick="window.parent.PF &amp;&amp; window.parent.PF('dialog').hide()" styleClass="ui-button-outlined"/>
                <p:commandButton value="Save" icon="pi pi-check" action="#{repaymentFormDialog.save}" update="dialogForm"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
