<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">LoanProduct | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>LoanProduct</h1>
                    <p>View and manage loanproduct records.</p>
                </div>
                <p:commandButton
                    value="New LoanProduct"
                    icon="pi pi-plus"
                    rendered="#{componentRenderer.hasPermission('LOAN_PRODUCT_CREATE')}"
                    action="#{loanProductFormDialog.show}">
                    <p:ajax event="dialogReturn" listener="#{loanProductView.reload}" update="@form" />
                </p:commandButton>
            </div>
            <p:messages id="messages" showDetail="true" closable="true" />
            <div class="table-filters">
                <i class="pi pi-search" />
                <p:inputText id="globalFilter" placeholder="Search records" onkeyup="PF('table_loanProduct').filter()" />
            </div>
            <p:poll interval="20" listener="#{loanProductView.reload}" update="table" />
            <p:dataTable
                id="table"
                globalFilterOnly="true"
                widgetVar="table_loanProduct"
                value="#{loanProductView.records}"
                var="row"
                paginator="true"
                rows="25"
                reflow="true"
                emptyMessage="No records found"
                styleClass="management-table">
                <p:column headerText="Product" filterBy="#{row.name}" filterMatchMode="contains">
                    <h:outputText value="#{row.name}" />
                </p:column>
                <p:column headerText="Minimum" filterBy="#{row.minimumAmount}" filterMatchMode="contains">
                    <h:outputText value="#{row.minimumAmount}" />
                </p:column>
                <p:column headerText="Maximum" filterBy="#{row.maximumAmount}" filterMatchMode="contains">
                    <h:outputText value="#{row.maximumAmount}" />
                </p:column>
                <p:column headerText="Rate" filterBy="#{row.monthlyInterestRate}" filterMatchMode="contains">
                    <h:outputText value="#{row.monthlyInterestRate}" />
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton
                        icon="pi pi-pencil"
                        title="Edit loan product"
                        rendered="#{componentRenderer.hasPermission('LOAN_PRODUCT_EDIT')}"
                        action="#{loanProductFormDialog.edit(row)}"
                        styleClass="ui-button-outlined">
                        <p:ajax event="dialogReturn" listener="#{loanProductView.reload}" update="@form" />
                    </p:commandButton>
                    <p:commandButton
                        icon="pi pi-trash"
                        rendered="#{componentRenderer.hasPermission('LOAN_PRODUCT_DELETE')}"
                        title="Delete"
                        styleClass="ui-button-danger ui-button-outlined"
                        action="#{loanProductView.delete(row)}"
                        update="@form" />
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
