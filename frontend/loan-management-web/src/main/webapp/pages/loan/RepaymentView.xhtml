<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">Repayment | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>Repayment</h1>
                    <p>View and manage repayment records.</p>
                </div>
            </div>
            <p:messages id="messages" showDetail="true" closable="true" />
            <div class="table-filters">
                <i class="pi pi-search" />
                <p:inputText id="globalFilter" placeholder="Search records" onkeyup="PF('table_repayment').filter()" />
            </div>
            <p:poll interval="20" listener="#{repaymentView.reload}" update="table" />
            <p:dataTable
                id="table"
                globalFilterOnly="true"
                widgetVar="table_repayment"
                value="#{repaymentView.records}"
                var="row"
                paginator="true"
                rows="25"
                reflow="true"
                emptyMessage="No records found"
                styleClass="management-table">
                <p:column headerText="Reference" filterBy="#{row.paymentReference}" filterMatchMode="contains">
                    <h:outputText value="#{row.paymentReference}" />
                </p:column>
                <p:column headerText="Amount" filterBy="#{row.amount}" filterMatchMode="contains">
                    <h:outputText value="#{row.amount}" />
                </p:column>
                <p:column headerText="Payment date" filterBy="#{row.paymentDate}" filterMatchMode="contains">
                    <h:outputText value="#{row.paymentDate}" />
                </p:column>
                <p:column headerText="Status" filterBy="#{row.status}" filterMatchMode="contains">
                    <h:outputText value="#{row.status}" />
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton
                        icon="pi pi-trash"
                        rendered="#{componentRenderer.hasPermission('REPAYMENT_DELETE')}"
                        title="Delete"
                        styleClass="ui-button-danger ui-button-outlined"
                        action="#{repaymentView.delete(row)}"
                        update="@form" />
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
