<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        template="/pages/californiatemplate/template.xhtml">

    <ui:define name="title">Apply for a loan | Blessed Winds Loans</ui:define>

    <ui:define name="content">
        <div class="page-header">
            <div>
                <h1>Apply for a salary-backed loan</h1>
                <p>Submit your request, attach application KYC, print the agreement, sign it and upload it for review.</p>
            </div>
        </div>

        <div class="application-steps">
            <span class="active">1. Application</span>
            <span>2. KYC documents</span>
            <span>3. Print and sign</span>
            <span>4. HR review</span>
            <span>5. Loan manager review</span>
        </div>

        <h:form id="applicationForm">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <p:panel header="Loan request" styleClass="application-card">
                <div class="form-grid">
                    <div class="field">
                        <p:outputLabel for="product" value="Loan product"/>
                        <p:selectOneMenu id="product"
                                         value="#{loanFormDialog.model.product}"
                                         converter="loanProductConverter"
                                         required="true">
                            <f:selectItem itemLabel="Select product" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{loanFormDialog.products}" var="product"
                                           itemLabel="#{product.name}" itemValue="#{product}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="field">
                        <p:outputLabel for="amount" value="Requested amount (UGX)"/>
                        <p:inputNumber id="amount" value="#{loanFormDialog.model.requestedAmount}"
                                       decimalPlaces="0" minValue="1" required="true"/>
                    </div>
                    <div class="field">
                        <p:outputLabel for="term" value="Requested term in months"/>
                        <p:spinner id="term" value="#{loanFormDialog.model.requestedTermMonths}"
                                   min="1" max="60" required="true"/>
                    </div>
                    <div class="field">
                        <p:outputLabel for="method" value="Preferred payout method"/>
                        <p:selectOneMenu id="method"
                                         value="#{loanFormDialog.model.preferredDisbursementMethod}"
                                         required="true">
                            <f:selectItem itemLabel="Select payout method" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{loanFormDialog.disbursementMethods}" var="method"
                                           itemLabel="#{method}" itemValue="#{method}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="field full-width">
                        <p:outputLabel for="purpose" value="Loan purpose"/>
                        <p:inputTextarea id="purpose" value="#{loanFormDialog.model.purpose}"
                                         rows="4" required="true"/>
                    </div>
                </div>
            </p:panel>

            <div class="dialog-actions">
                <p:button value="Cancel" icon="pi pi-times" outcome="/pages/dashboard/EmployeeDashboard"
                          styleClass="ui-button-outlined"/>
                <p:commandButton value="Submit application" icon="pi pi-send"
                                 action="#{loanFormDialog.submitApplication}"
                                 process="@form" update="applicationForm"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
