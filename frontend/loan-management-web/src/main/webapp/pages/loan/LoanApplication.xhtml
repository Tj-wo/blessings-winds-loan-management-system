<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">Apply for loan</ui:define>
    <ui:define name="content">
        <div class="page-header">
            <div>
                <h1>Loan application</h1>
                <p>Request a salary-backed loan. Final approved terms may be reduced after affordability review.</p>
            </div>
        </div>
        <h:form>
            <p:messages/>
            <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
                <p:outputLabel for="amount" value="Requested amount"/>
                <p:inputNumber id="amount" value="#{loanFormDialog.model.requestedAmount}" decimalPlaces="0" required="true"/>
                <p:outputLabel for="term" value="Term in months"/>
                <p:spinner id="term" value="#{loanFormDialog.model.requestedTermMonths}" min="1" max="60"/>
                <p:outputLabel for="purpose" value="Purpose"/>
                <p:inputTextarea id="purpose" value="#{loanFormDialog.model.purpose}" required="true"/>
            </p:panelGrid>
            <p:commandButton value="Submit application" icon="pi pi-send" action="#{loanFormDialog.save}"/>
        </h:form>
    </ui:define>
</ui:composition>
