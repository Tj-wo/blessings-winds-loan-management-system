<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">Disbursement | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <div class="page-header">
            <div>
                <h1>Disbursement</h1>
                <p>View and manage disbursement records.</p>
            </div>
            <p:commandButton value="New Disbursement" icon="pi pi-plus" rendered="#{componentRenderer.hasPermission('DISBURSEMENT_CREATE')}" actionListener="#{disbursementFormDialog.show}"/>
        </div>
        <h:form id="form">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <p:dataTable id="table" widgetVar="table_disbursement" value="#{disbursementView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Search">
                    <p:inputText placeholder="Filter" onkeyup="PF('table_disbursement').filter()"/>
                </p:column>
                <p:column headerText="Transaction">
                    <h:outputText value="#{row.transactionReference}"/>
                </p:column>
                <p:column headerText="Amount">
                    <h:outputText value="#{row.amount}"/>
                </p:column>
                <p:column headerText="Method">
                    <h:outputText value="#{row.method}"/>
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{row.status}"/>
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton icon="pi pi-trash" title="Delete" styleClass="ui-button-danger ui-button-outlined" action="#{disbursementView.delete(row)}" update="table messages"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
