<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">AuditLog | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <div class="page-header">
            <div>
                <h1>AuditLog</h1>
                <p>View and manage auditlog records.</p>
            </div>
        </div>
        <h:form id="form">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <p:dataTable id="table" widgetVar="table_auditLog" value="#{auditLogView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Search">
                    <p:inputText placeholder="Filter" onkeyup="PF('table_auditLog').filter()"/>
                </p:column>
                <p:column headerText="Time">
                    <h:outputText value="#{row.eventTime}"/>
                </p:column>
                <p:column headerText="Actor">
                    <h:outputText value="#{row.actor.username}"/>
                </p:column>
                <p:column headerText="Action">
                    <h:outputText value="#{row.action}"/>
                </p:column>
                <p:column headerText="Entity">
                    <h:outputText value="#{row.entityType}"/>
                </p:column>
                <p:column headerText="Actions">
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
