<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/dialog-template.xhtml">
    <ui:define name="dialog-content">
        <h:form id="dialogForm">
            <p:messages showDetail="true"/>
            <div class="dialog-header">
                <h2>#{companyFormDialog.editing ? 'Edit Company' : 'New Company'}</h2>
            </div>
            <div class="form-grid">

                <div class="field">
                    <p:outputLabel for="name" value="Company name"/>
                    <p:inputText id="name" value="#{companyFormDialog.model.name}"/>
                </div>

                <div class="field">
                    <p:outputLabel for="physicalAddress" value="Physical address"/>
                    <p:inputText id="physicalAddress" value="#{companyFormDialog.model.physicalAddress}"/>
                </div>

                <div class="field">
                    <p:outputLabel for="contactPerson" value="Contact person"/>
                    <p:inputText id="contactPerson" value="#{companyFormDialog.model.contactPerson}"/>
                </div>

                <div class="field">
                    <p:outputLabel for="contactEmail" value="Contact email"/>
                    <p:inputText id="contactEmail" value="#{companyFormDialog.model.contactEmail}"/>
                </div>

                <div class="field">
                    <p:outputLabel for="contactPhone" value="Contact phone"/>
                    <p:inputText id="contactPhone" value="#{companyFormDialog.model.contactPhone}"/>
                </div>
            </div>
            <div class="dialog-actions">
                <p:commandButton value="Cancel" icon="pi pi-times" action="#{companyFormDialog.cancel}" process="@this" styleClass="ui-button-outlined"/>
                <p:commandButton value="Save" icon="pi pi-check" action="#{companyFormDialog.save}" update="dialogForm"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
