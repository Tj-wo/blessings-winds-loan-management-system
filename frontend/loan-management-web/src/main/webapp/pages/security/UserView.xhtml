<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">User | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>User</h1>
                    <p>View and manage user records.</p>
                </div>
                <p:commandButton value="New User" icon="pi pi-plus" rendered="#{componentRenderer.hasPermission('USER_CREATE')}" action="#{userFormDialog.show}">
                    <p:ajax event="dialogReturn" update="@form"/>
                </p:commandButton>
            </div>
            <p:messages id="messages" showDetail="true" closable="true"/>
            <div class="table-filters">
                <i class="pi pi-search"/>
                <p:inputText id="globalFilter" placeholder="Search records" onkeyup="PF('table_user').filter()"/>
            </div>
            <p:dataTable id="table" globalFilterOnly="true" widgetVar="table_user" value="#{userView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Username">
                    <h:outputText value="#{row.username}"/>
                </p:column>
                <p:column headerText="Display name">
                    <h:outputText value="#{row.displayName}"/>
                </p:column>
                <p:column headerText="Email">
                    <h:outputText value="#{row.email}"/>
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{row.accountStatus}"/>
                </p:column>
                <p:column headerText="Actions">
                    <div class="table-actions">
                        <p:commandButton icon="pi pi-check-circle"
                                         title="Activate account"
                                         rendered="#{row.accountStatus ne 'ACTIVE' and componentRenderer.hasPermission('USER_EDIT')}"
                                         action="#{userView.activate(row)}" update="@form"
                                         styleClass="ui-button-success ui-button-outlined"/>
                        <p:commandButton icon="pi pi-ban"
                                         title="Deactivate account"
                                         rendered="#{row.accountStatus eq 'ACTIVE' and componentRenderer.hasPermission('USER_EDIT')}"
                                         action="#{userView.deactivate(row)}" update="@form"
                                         styleClass="ui-button-warning ui-button-outlined"/>
                    <p:commandButton icon="pi pi-pencil"
                                     title="Edit user"
                                     rendered="#{componentRenderer.hasPermission('USER_EDIT')}"
                                     action="#{userFormDialog.edit(row)}"
                                     styleClass="ui-button-outlined">
                        <p:ajax event="dialogReturn" update="@form"/>
                    </p:commandButton>

                        <p:commandButton icon="pi pi-trash" rendered="#{componentRenderer.hasPermission('USER_DELETE')}" title="Delete" styleClass="ui-button-danger ui-button-outlined" action="#{userView.delete(row)}" update="@form"/>
                    </div>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
