<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">Notifications | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>Notifications</h1>
                    <p>#{notificationView.unreadCount} unread notification#{notificationView.unreadCount eq 1 ? '' : 's'}.</p>
                </div>
                <div class="table-actions">
                    <p:commandButton
                        value="Mark all as read"
                        icon="pi pi-check-circle"
                        rendered="#{notificationView.unreadCount gt 0}"
                        action="#{notificationView.markAllAsRead}"
                        update="@form :notificationBadgeForm:notificationIndicator"
                        styleClass="ui-button-outlined" />
                    <p:commandButton
                        value="New notification"
                        icon="pi pi-plus"
                        rendered="#{componentRenderer.hasPermission('NOTIFICATION_CREATE')}"
                        action="#{notificationFormDialog.show}">
                        <p:ajax event="dialogReturn" listener="#{notificationView.reload}" update="@form" />
                    </p:commandButton>
                </div>
            </div>
            <p:messages id="messages" showDetail="true" closable="true" />
            <div class="table-filters">
                <i class="pi pi-search" />
                <p:inputText id="globalFilter" placeholder="Search notifications" onkeyup="PF('table_notification').filter()" />
            </div>
            <p:poll
                interval="20"
                listener="#{notificationView.reload}"
                update="table unreadSummary :notificationBadgeForm:notificationIndicator" />
            <h:panelGroup id="unreadSummary" layout="block" styleClass="notification-summary">
                <strong>#{notificationView.unreadCount}</strong> unread</h:panelGroup>
            <p:dataTable
                id="table"
                globalFilterOnly="true"
                widgetVar="table_notification"
                value="#{notificationView.records}"
                var="row"
                paginator="true"
                rows="25"
                reflow="true"
                emptyMessage="You have no notifications"
                styleClass="management-table">
                <p:column headerText="Notification">
                    <div class="notification-title">
                        <h:panelGroup layout="block" styleClass="notification-unread-dot" rendered="#{empty row.readAt}" />
                        <div>
                            <strong>#{row.title}</strong>
                            <small>#{row.message}</small>
                        </div>
                    </div>
                </p:column>
                <p:column headerText="Status">
                    <h:outputText
                        value="#{empty row.readAt ? 'Unread' : 'Read'}"
                        styleClass="status-pill #{empty row.readAt ? 'status-SUBMITTED' : 'status-COMPLETED'}" />
                </p:column>
                <p:column headerText="Created">
                    <h:outputText value="#{row.createdAt}" />
                </p:column>
                <p:column headerText="Actions">
                    <div class="table-actions">
                        <p:commandButton
                            icon="pi pi-check"
                            title="Mark as read"
                            rendered="#{empty row.readAt}"
                            action="#{notificationView.markAsRead(row)}"
                            update="@form :notificationBadgeForm:notificationIndicator"
                            styleClass="ui-button-success icon-action" />
                        <p:commandButton
                            icon="pi pi-pencil"
                            title="Edit notification"
                            rendered="#{componentRenderer.hasPermission('NOTIFICATION_EDIT')}"
                            action="#{notificationFormDialog.edit(row)}"
                            styleClass="ui-button-outlined icon-action">
                            <p:ajax event="dialogReturn" listener="#{notificationView.reload}" update="@form" />
                        </p:commandButton>
                        <p:commandButton
                            icon="pi pi-trash"
                            rendered="#{componentRenderer.hasPermission('NOTIFICATION_DELETE')}"
                            title="Delete"
                            styleClass="ui-button-danger ui-button-outlined icon-action"
                            action="#{notificationView.delete(row)}"
                            update="@form :notificationBadgeForm:notificationIndicator" />
                    </div>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
