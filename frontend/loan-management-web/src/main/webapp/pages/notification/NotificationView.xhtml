<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">Notification | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>Notification</h1>
                    <p>View and manage notification records.</p>
                </div>
                <p:commandButton value="New Notification" icon="pi pi-plus" rendered="#{componentRenderer.hasPermission('NOTIFICATION_CREATE')}" action="#{notificationFormDialog.show}">
                    <p:ajax event="dialogReturn" update="@form"/>
                </p:commandButton>
            </div>
            <p:messages id="messages" showDetail="true" closable="true"/>
            <div class="table-filters">
                <i class="pi pi-search"/>
                <p:inputText id="globalFilter" placeholder="Search records" onkeyup="PF('table_notification').filter()"/>
            </div>
            <p:dataTable id="table" globalFilterOnly="true" widgetVar="table_notification" value="#{notificationView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Title">
                    <h:outputText value="#{row.title}"/>
                </p:column>
                <p:column headerText="Channel">
                    <h:outputText value="#{row.channel}"/>
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{row.status}"/>
                </p:column>
                <p:column headerText="Created">
                    <h:outputText value="#{row.createdAt}"/>
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton icon="pi pi-pencil"
                                     title="Edit notification"
                                     rendered="#{componentRenderer.hasPermission('NOTIFICATION_EDIT')}"
                                     action="#{notificationFormDialog.edit(row)}"
                                     styleClass="ui-button-outlined">
                        <p:ajax event="dialogReturn" update="@form"/>
                    </p:commandButton>

                    <p:commandButton icon="pi pi-trash" rendered="#{componentRenderer.hasPermission('NOTIFICATION_DELETE')}" title="Delete" styleClass="ui-button-danger ui-button-outlined" action="#{notificationView.delete(row)}" update="@form"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
