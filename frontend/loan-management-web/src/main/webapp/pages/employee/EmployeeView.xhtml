<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">Employee | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <div class="page-header">
            <div>
                <h1>Employee</h1>
                <p>View and manage employee records.</p>
            </div>
            <p:commandButton value="New Employee" icon="pi pi-plus" rendered="#{componentRenderer.hasPermission('EMPLOYEE_CREATE')}" actionListener="#{employeeFormDialog.show}"/>
        </div>
        <h:form id="form">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <p:dataTable id="table" widgetVar="table_employee" value="#{employeeView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Search">
                    <p:inputText placeholder="Filter" onkeyup="PF('table_employee').filter()"/>
                </p:column>
                <p:column headerText="Employee no.">
                    <h:outputText value="#{row.employeeNumber}"/>
                </p:column>
                <p:column headerText="First name">
                    <h:outputText value="#{row.firstName}"/>
                </p:column>
                <p:column headerText="Last name">
                    <h:outputText value="#{row.lastName}"/>
                </p:column>
                <p:column headerText="KYC status">
                    <h:outputText value="#{row.kycStatus}"/>
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton icon="pi pi-trash" title="Delete" styleClass="ui-button-danger ui-button-outlined" action="#{employeeView.delete(row)}" update="table messages"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
