<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        template="/pages/californiatemplate/dialog-template.xhtml">

    <ui:define name="dialog-content">
        <h:form id="dialogForm" enctype="multipart/form-data">
            <p:messages id="messages" showDetail="true"/>

            <div class="dialog-header">
                <h2>#{documentFormDialog.signedAgreementUpload ? 'Upload signed loan agreement' : 'Upload KYC document'}</h2>
                <p>Upload reusable KYC evidence. Choose a loan only for application-specific files such as a signed agreement.</p>
            </div>

            <div class="form-grid">
                <div class="field">
                    <p:outputLabel for="loan" value="Loan application"/>
                    <p:selectOneMenu id="loan"
                                     value="#{documentFormDialog.model.loan}"
                                     converter="loanConverter"
                                     disabled="#{documentFormDialog.signedAgreementUpload}">
                        <f:selectItem itemLabel="Use for all applications" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{documentFormDialog.employeeLoans}"
                                       var="loan"
                                       itemLabel="#{loan.loanReference} - #{loan.status}"
                                       itemValue="#{loan}"/>
                    </p:selectOneMenu>
                </div>

                <div class="field">
                    <p:outputLabel for="documentType" value="Document type"/>
                    <p:selectOneMenu id="documentType"
                                     value="#{documentFormDialog.model.documentType}"
                                     required="true"
                                     requiredMessage="Document type is required"
                                     disabled="#{documentFormDialog.signedAgreementUpload}">
                        <f:selectItem itemLabel="Select document type" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{documentFormDialog.documentTypes}"
                                       var="type"
                                       itemLabel="#{type}"
                                       itemValue="#{type}"/>
                    </p:selectOneMenu>
                </div>
            </div>

            <div class="field section">
                <p:outputLabel for="file" value="Choose file"/>
                <p:fileUpload id="file"
                              mode="advanced"
                              auto="true"
                              dragDropSupport="true"
                              listener="#{documentFormDialog.handleUpload}"
                              update="messages selectedFile"
                              sizeLimit="10485760"
                              allowTypes="/(\.|\/)(pdf|png|jpe?g)$/"
                              invalidFileMessage="Only PDF, PNG and JPG files are allowed"
                              invalidSizeMessage="The maximum upload size is 10 MB"/>
                <h:panelGroup id="selectedFile" layout="block" styleClass="upload-selection">
                    <h:outputText value="Selected: #{documentFormDialog.model.originalFilename}"
                                  rendered="#{not empty documentFormDialog.model.originalFilename}"/>
                </h:panelGroup>
            </div>

            <div class="dialog-actions">
                <p:commandButton value="Cancel" icon="pi pi-times"
                                 action="#{documentFormDialog.cancel}" process="@this"
                                 styleClass="ui-button-outlined"/>
                <p:commandButton value="Attach document" icon="pi pi-upload"
                                 action="#{documentFormDialog.save}"
                                 process="@form" update="dialogForm"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
