<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">Document | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>Application documents</h1>
                    <p>Upload KYC evidence and signed agreements against your loan applications.</p>
                </div>
                <p:commandButton value="Upload document" icon="pi pi-upload" rendered="#{componentRenderer.hasPermission('DOCUMENT_CREATE')}" action="#{documentFormDialog.show}">
                    <p:ajax event="dialogReturn" update="@form"/>
                </p:commandButton>
            </div>
            <p:messages id="messages" showDetail="true" closable="true"/>
            <div class="table-filters">
                <i class="pi pi-search"/>
                <p:inputText id="globalFilter" placeholder="Search records" onkeyup="PF('table_document').filter()"/>
            </div>
            <p:dataTable id="table" globalFilterOnly="true" widgetVar="table_document" value="#{documentView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Filename">
                    <h:outputText value="#{row.originalFilename}"/>
                </p:column>
                <p:column headerText="Type">
                    <h:outputText value="#{row.documentType}"/>
                </p:column>
                <p:column headerText="Verification">
                    <h:outputText value="#{row.verificationStatus}"/>
                </p:column>
                <p:column headerText="Size">
                    <h:outputText value="#{row.contentSize}"/>
                </p:column>
                <p:column headerText="Actions">

                    <p:commandButton icon="pi pi-trash" rendered="#{componentRenderer.hasPermission('DOCUMENT_DELETE')}" title="Delete" styleClass="ui-button-danger ui-button-outlined" action="#{documentView.delete(row)}" update="@form"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
