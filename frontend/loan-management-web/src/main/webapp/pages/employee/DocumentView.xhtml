<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">Document | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>KYC documents</h1>
                    <p>Complete KYC once before applying. These documents are automatically attached to every loan application.</p>
                </div>
                <p:commandButton
                    value="Upload document"
                    icon="pi pi-upload"
                    rendered="#{componentRenderer.hasPermission('DOCUMENT_CREATE') and not empty authenticationController.loggedInUser.employee}"
                    action="#{documentFormDialog.show}">
                    <p:ajax event="dialogReturn" listener="#{documentView.reload}" update="@form" />
                </p:commandButton>
            </div>
            <p:messages id="messages" showDetail="true" closable="true" />
            <div class="table-filters">
                <i class="pi pi-search" />
                <p:inputText id="globalFilter" placeholder="Search records" onkeyup="PF('table_document').filter()" />
            </div>
            <p:poll interval="20" listener="#{documentView.reload}" update="table" />
            <p:dataTable
                id="table"
                globalFilterOnly="true"
                widgetVar="table_document"
                value="#{documentView.records}"
                var="row"
                paginator="true"
                rows="25"
                reflow="true"
                emptyMessage="No records found"
                styleClass="management-table">
                <p:column headerText="Filename" filterBy="#{row.originalFilename}" filterMatchMode="contains">
                    <h:outputText value="#{row.originalFilename}" />
                </p:column>
                <p:column headerText="Employee" filterBy="#{row.employee.employeeNumber}" filterMatchMode="contains">
                    <h:outputText value="#{row.employee.firstName} #{row.employee.lastName}" />
                    <br />
                    <h:outputText value="#{row.employee.employeeNumber}" styleClass="text-muted" />
                </p:column>
                <p:column headerText="Type" filterBy="#{row.documentType}" filterMatchMode="contains">
                    <h:outputText value="#{row.documentType}" />
                </p:column>
                <p:column headerText="Verification" filterBy="#{row.verificationStatus}" filterMatchMode="contains">
                    <h:outputText value="#{row.verificationStatus}" />
                </p:column>
                <p:column headerText="Size" filterBy="#{row.contentSize}" filterMatchMode="contains">
                    <h:outputText value="#{row.contentSize}" />
                </p:column>
                <p:column headerText="Actions" styleClass="document-actions-column">
                    <div class="table-actions">
                        <h:outputLink
                            value="#{request.contextPath}/documents/content/#{row.id}"
                            target="_blank"
                            title="Preview KYC"
                            styleClass="ui-button ui-widget ui-state-default ui-corner-all ui-button-icon-only ui-button-outlined">
                            <i class="pi pi-eye" />
                        </h:outputLink>
                        <p:commandButton
                            icon="pi pi-check"
                            rendered="#{componentRenderer.hasPermission('DOCUMENT_VERIFY') and row.verificationStatus ne 'VERIFIED'}"
                            title="Approve KYC"
                            styleClass="ui-button-success ui-button-outlined"
                            action="#{documentView.approve(row)}"
                            update="@form" />
                        <p:commandButton
                            icon="pi pi-times"
                            rendered="#{componentRenderer.hasPermission('DOCUMENT_VERIFY') and row.verificationStatus ne 'REJECTED'}"
                            title="Reject KYC"
                            styleClass="ui-button-warning ui-button-outlined"
                            action="#{documentView.reject(row)}"
                            update="@form" />
                        <p:commandButton
                            icon="pi pi-trash"
                            rendered="#{documentView.isOwner(row)}"
                            title="Delete my document"
                            styleClass="ui-button-danger ui-button-outlined"
                            action="#{documentView.delete(row)}"
                            update="@form" />
                    </div>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
