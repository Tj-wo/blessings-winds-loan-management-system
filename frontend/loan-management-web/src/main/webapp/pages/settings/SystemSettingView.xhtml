<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">SystemSetting | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <div class="page-header">
            <div>
                <h1>SystemSetting</h1>
                <p>View and manage systemsetting records.</p>
            </div>
            <p:commandButton value="New SystemSetting" icon="pi pi-plus" rendered="#{componentRenderer.hasPermission('SYSTEM_SETTING_CREATE')}" actionListener="#{systemSettingFormDialog.show}"/>
        </div>
        <h:form id="form">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <p:dataTable id="table" widgetVar="table_systemSetting" value="#{systemSettingView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Search">
                    <p:inputText placeholder="Filter" onkeyup="PF('table_systemSetting').filter()"/>
                </p:column>
                <p:column headerText="Key">
                    <h:outputText value="#{row.settingKey}"/>
                </p:column>
                <p:column headerText="Value">
                    <h:outputText value="#{row.settingValue}"/>
                </p:column>
                <p:column headerText="Category">
                    <h:outputText value="#{row.category}"/>
                </p:column>
                <p:column headerText="Type">
                    <h:outputText value="#{row.valueType}"/>
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton icon="pi pi-trash" title="Delete" styleClass="ui-button-danger ui-button-outlined" action="#{systemSettingView.delete(row)}" update="table messages"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
