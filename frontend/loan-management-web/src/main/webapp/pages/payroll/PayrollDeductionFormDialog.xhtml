<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/pages/californiatemplate/dialog-template.xhtml">
    <ui:define name="dialog-content">
        <h:form id="dialogForm">
            <p:messages showDetail="true" />
            <div class="dialog-header">
                <h2>#{payrollDeductionFormDialog.editing ? 'Edit payroll deduction' : 'Add payroll deduction'}</h2>
            </div>
            <div class="form-grid">
                <div class="field">
                    <p:outputLabel for="batch" value="Payroll batch" />
                    <p:selectOneMenu
                        id="batch"
                        value="#{payrollDeductionFormDialog.model.batch}"
                        converter="payrollDeductionBatchConverter"
                        required="true">
                        <f:selectItem itemLabel="Select batch" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems
                            value="#{payrollDeductionFormDialog.companyBatches}"
                            var="batch"
                            itemLabel="#{batch.batchReference} - #{batch.payrollPeriod}"
                            itemValue="#{batch}" />
                    </p:selectOneMenu>
                </div>
                <div class="field">
                    <p:outputLabel for="loan" value="Employee loan" />
                    <p:selectOneMenu id="loan" value="#{payrollDeductionFormDialog.model.loan}" converter="loanConverter" required="true">
                        <f:selectItem itemLabel="Select employee loan" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems
                            value="#{payrollDeductionFormDialog.companyLoans}"
                            var="loan"
                            itemLabel="#{loan.employee.firstName} #{loan.employee.lastName} - #{loan.loanReference}"
                            itemValue="#{loan}" />
                    </p:selectOneMenu>
                </div>
                <div class="field">
                    <p:outputLabel for="expectedAmount" value="Expected amount" />
                    <p:inputNumber
                        id="expectedAmount"
                        value="#{payrollDeductionFormDialog.model.expectedAmount}"
                        decimalPlaces="2"
                        placeholder="Uses loan installment if blank" />
                </div>
                <div class="field">
                    <p:outputLabel for="deductedAmount" value="Deducted amount" />
                    <p:inputNumber
                        id="deductedAmount"
                        value="#{payrollDeductionFormDialog.model.deductedAmount}"
                        decimalPlaces="2"
                        required="true" />
                </div>
                <div class="field">
                    <p:outputLabel for="comment" value="Reconciliation comment" />
                    <p:inputText id="comment" value="#{payrollDeductionFormDialog.model.reconciliationComment}" />
                </div>
            </div>
            <div class="dialog-actions">
                <p:commandButton
                    value="Cancel"
                    icon="pi pi-times"
                    action="#{payrollDeductionFormDialog.cancel}"
                    process="@this"
                    styleClass="ui-button-outlined" />
                <p:commandButton
                    value="Save"
                    icon="pi pi-check"
                    action="#{payrollDeductionFormDialog.save}"
                    process="@form"
                    update="dialogForm" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>
