<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/dialog-template.xhtml">
    <ui:define name="dialog-content">
        <h:form id="dialogForm">
            <p:messages showDetail="true"/>
            <div class="dialog-header">
                <h2>#{payrollDeductionFormDialog.editing ? 'Edit PayrollDeduction' : 'New PayrollDeduction'}</h2>
            </div>
            <div class="form-grid">
                <div class="field">
                    <p:outputLabel for="expectedAmount" value="Expected amount"/>
                    <p:inputNumber id="expectedAmount" value="#{payrollDeductionFormDialog.model.expectedAmount}" decimalPlaces="2"/>
                </div>

                <div class="field">
                    <p:outputLabel for="deductedAmount" value="Deducted amount"/>
                    <p:inputNumber id="deductedAmount" value="#{payrollDeductionFormDialog.model.deductedAmount}" decimalPlaces="2"/>
                </div>

                <div class="field">
                    <p:outputLabel for="reconciliationComment" value="Reconciliation comment"/>
                    <p:inputText id="reconciliationComment" value="#{payrollDeductionFormDialog.model.reconciliationComment}"/>
                </div>
            </div>
            <div class="dialog-actions">
                <p:commandButton value="Cancel" icon="pi pi-times" action="#{payrollDeductionFormDialog.cancel}" process="@this" styleClass="ui-button-outlined"/>
                <p:commandButton value="Save" icon="pi pi-check" action="#{payrollDeductionFormDialog.save}" update="dialogForm"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
