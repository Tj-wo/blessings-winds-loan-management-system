<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/pages/californiatemplate/dialog-template.xhtml">
    <ui:define name="dialog-content">
        <h:form id="dialogForm">
            <p:messages showDetail="true" />
            <div class="dialog-header">
                <h2>#{payrollDeductionBatchFormDialog.editing ? 'Edit payroll batch' : 'Create payroll batch'}</h2>
                <p>Start a payroll period before adding employee deductions.</p>
            </div>
            <div class="form-grid">
                <div class="field">
                    <p:outputLabel for="batchReference" value="Batch reference" />
                    <p:inputText
                        id="batchReference"
                        value="#{payrollDeductionBatchFormDialog.model.batchReference}"
                        required="true"
                        placeholder="e.g. JUL-2026" />
                </div>
                <div class="field">
                    <p:outputLabel for="payrollPeriod" value="Payroll period" />
                    <p:inputMask
                        id="payrollPeriod"
                        value="#{payrollDeductionBatchFormDialog.payrollPeriod}"
                        mask="9999-99"
                        required="true"
                        placeholder="YYYY-MM" />
                </div>
                <div class="field">
                    <p:outputLabel for="source" value="Source or filename" />
                    <p:inputText
                        id="source"
                        value="#{payrollDeductionBatchFormDialog.model.originalFilename}"
                        required="true"
                        placeholder="Manual entry or payroll filename" />
                </div>
            </div>
            <div class="dialog-actions">
                <p:commandButton
                    value="Cancel"
                    icon="pi pi-times"
                    action="#{payrollDeductionBatchFormDialog.cancel}"
                    process="@this"
                    styleClass="ui-button-outlined" />
                <p:commandButton
                    value="Save batch"
                    icon="pi pi-check"
                    action="#{payrollDeductionBatchFormDialog.save}"
                    process="@form"
                    update="dialogForm" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>
