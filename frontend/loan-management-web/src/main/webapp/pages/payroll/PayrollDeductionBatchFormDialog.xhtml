<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/dialog-template.xhtml">
    <ui:define name="dialog-content">
        <h:form id="dialogForm">
            <p:messages showDetail="true"/>
            <div class="dialog-header">
                <h2>#{payrollDeductionBatchFormDialog.editing ? 'Edit PayrollDeductionBatch' : 'New PayrollDeductionBatch'}</h2>
            </div>
            <div class="form-grid">
                <div class="field">
                    <p:outputLabel for="batchReference" value="Batch reference"/>
                    <p:inputText id="batchReference" value="#{payrollDeductionBatchFormDialog.model.batchReference}"/>
                </div>

                <div class="field">
                    <p:outputLabel for="originalFilename" value="Original filename"/>
                    <p:inputText id="originalFilename" value="#{payrollDeductionBatchFormDialog.model.originalFilename}"/>
                </div>

                <div class="field">
                    <p:outputLabel for="expectedTotal" value="Expected total"/>
                    <p:inputNumber id="expectedTotal" value="#{payrollDeductionBatchFormDialog.model.expectedTotal}" decimalPlaces="2"/>
                </div>

                <div class="field">
                    <p:outputLabel for="receivedTotal" value="Received total"/>
                    <p:inputNumber id="receivedTotal" value="#{payrollDeductionBatchFormDialog.model.receivedTotal}" decimalPlaces="2"/>
                </div>

                <div class="field">
                    <p:outputLabel for="recordCount" value="Record count"/>
                    <p:inputNumber id="recordCount" value="#{payrollDeductionBatchFormDialog.model.recordCount}" decimalPlaces="2"/>
                </div>
            </div>
            <div class="dialog-actions">
                <p:commandButton value="Cancel" icon="pi pi-times" action="#{payrollDeductionBatchFormDialog.cancel}" process="@this" styleClass="ui-button-outlined"/>
                <p:commandButton value="Save" icon="pi pi-check" action="#{payrollDeductionBatchFormDialog.save}" update="dialogForm"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
