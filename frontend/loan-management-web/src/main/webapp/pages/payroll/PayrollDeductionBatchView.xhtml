<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">PayrollDeductionBatch | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <div class="page-header">
            <div>
                <h1>PayrollDeductionBatch</h1>
                <p>View and manage payrolldeductionbatch records.</p>
            </div>
            <p:commandButton value="New PayrollDeductionBatch" icon="pi pi-plus" rendered="#{componentRenderer.hasPermission('PAYROLL_DEDUCTION_BATCH_CREATE')}" actionListener="#{payrollDeductionBatchFormDialog.show}"/>
        </div>
        <h:form id="form">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <p:dataTable id="table" widgetVar="table_payrollDeductionBatch" value="#{payrollDeductionBatchView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Search">
                    <p:inputText placeholder="Filter" onkeyup="PF('table_payrollDeductionBatch').filter()"/>
                </p:column>
                <p:column headerText="Batch">
                    <h:outputText value="#{row.batchReference}"/>
                </p:column>
                <p:column headerText="Payroll period">
                    <h:outputText value="#{row.payrollPeriod}"/>
                </p:column>
                <p:column headerText="Received">
                    <h:outputText value="#{row.receivedTotal}"/>
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{row.status}"/>
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton icon="pi pi-trash" title="Delete" styleClass="ui-button-danger ui-button-outlined" action="#{payrollDeductionBatchView.delete(row)}" update="table messages"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
