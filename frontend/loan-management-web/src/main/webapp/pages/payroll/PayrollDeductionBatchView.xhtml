<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"

        template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">PayrollDeductionBatch | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>PayrollDeductionBatch</h1>
                    <p>View and manage payrolldeductionbatch records.</p>
                </div>
                <p:commandButton value="New PayrollDeductionBatch" icon="pi pi-plus" rendered="#{componentRenderer.hasPermission('PAYROLL_DEDUCTION_BATCH_CREATE')}" action="#{payrollDeductionBatchFormDialog.show}">
                    <p:ajax event="dialogReturn" update="@form"/>
                </p:commandButton>
            </div>
            <p:messages id="messages" showDetail="true" closable="true"/>
            <div class="table-filters">
                <i class="pi pi-search"/>
                <p:inputText id="globalFilter" placeholder="Search records" onkeyup="PF('table_payrollDeductionBatch').filter()"/>
            </div>
            <p:dataTable id="table" globalFilterOnly="true" widgetVar="table_payrollDeductionBatch" value="#{payrollDeductionBatchView.records}" var="row" paginator="true" rows="25" reflow="true" emptyMessage="No records found" styleClass="management-table">
                <p:column headerText="Batch">
                    <h:outputText value="#{row.batchReference}"/>
                </p:column>
                <p:column headerText="Payroll period">
                    <h:outputText value="#{row.payrollPeriod}"/>
                </p:column>
                <p:column headerText="Received">
                    <h:outputText value="#{row.receivedTotal}"/>
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{row.status}"/>
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton icon="pi pi-pencil"
                                     title="Edit payroll batch"
                                     rendered="#{componentRenderer.hasPermission('PAYROLL_BATCH_EDIT')}"
                                     action="#{payrollDeductionBatchFormDialog.edit(row)}"
                                     styleClass="ui-button-outlined">
                        <p:ajax event="dialogReturn" update="@form"/>
                    </p:commandButton>

                    <p:commandButton icon="pi pi-trash" rendered="#{componentRenderer.hasPermission('PAYROLL_BATCH_DELETE')}" title="Delete" styleClass="ui-button-danger ui-button-outlined" action="#{payrollDeductionBatchView.delete(row)}" update="@form"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
