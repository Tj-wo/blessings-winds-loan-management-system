<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/pages/californiatemplate/template.xhtml">
    <ui:define name="title">PayrollDeduction | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <div class="page-header">
                <div>
                    <h1>PayrollDeduction</h1>
                    <p>View and manage payrolldeduction records.</p>
                </div>
                <p:commandButton
                    value="Add deduction"
                    icon="pi pi-plus"
                    rendered="#{componentRenderer.hasRole('HR Supervisor') and componentRenderer.hasPermission('PAYROLL_DEDUCTION_CREATE')}"
                    action="#{payrollDeductionFormDialog.show}">
                    <p:ajax event="dialogReturn" listener="#{payrollDeductionView.reload}" update="@form" />
                </p:commandButton>
            </div>
            <p:messages id="messages" showDetail="true" closable="true" />
            <div class="table-filters">
                <i class="pi pi-search" />
                <p:inputText id="globalFilter" placeholder="Search records" onkeyup="PF('table_payrollDeduction').filter()" />
            </div>
            <p:poll interval="20" listener="#{payrollDeductionView.reload}" update="table" />
            <p:dataTable
                id="table"
                globalFilterOnly="true"
                widgetVar="table_payrollDeduction"
                value="#{payrollDeductionView.records}"
                var="row"
                paginator="true"
                rows="25"
                reflow="true"
                emptyMessage="No records found"
                styleClass="management-table">
                <p:column headerText="Employee">
                    <h:outputText value="#{row.employee.firstName} #{row.employee.lastName}" />
                </p:column>
                <p:column headerText="Loan">
                    <h:outputText value="#{row.loan.loanReference}" />
                </p:column>
                <p:column headerText="Expected">
                    <h:outputText value="#{row.expectedAmount}" />
                </p:column>
                <p:column headerText="Deducted">
                    <h:outputText value="#{row.deductedAmount}" />
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{row.status}" />
                </p:column>
                <p:column headerText="Comment">
                    <h:outputText value="#{row.reconciliationComment}" />
                </p:column>
                <p:column headerText="Actions">
                    <div class="table-actions">
                        <p:commandButton
                            icon="pi pi-check"
                            title="Mark as repaid"
                            rendered="#{componentRenderer.hasRole('HR Supervisor') and (row.status eq 'PENDING' or row.status eq 'PARTIAL' or row.status eq 'UNMATCHED')}"
                            action="#{payrollDeductionView.markRepaid(row)}"
                            update="@form"
                            styleClass="ui-button-success icon-action" />
                        <p:commandButton
                            icon="pi pi-verified"
                            title="Confirm payment received"
                            rendered="#{componentRenderer.hasRole('Administrator') and row.status eq 'REPAID'}"
                            action="#{payrollDeductionView.confirmReceived(row)}"
                            update="@form"
                            styleClass="ui-button-success icon-action" />
                        <p:commandButton
                            icon="pi pi-pencil"
                            rendered="#{componentRenderer.hasPermission('PAYROLL_DEDUCTION_EDIT') and (row.status eq 'PENDING' or row.status eq 'PARTIAL' or row.status eq 'UNMATCHED')}"
                            title="Edit"
                            action="#{payrollDeductionFormDialog.edit(row)}">
                            <p:ajax event="dialogReturn" listener="#{payrollDeductionView.reload}" update="@form" />
                        </p:commandButton>
                        <p:commandButton
                            icon="pi pi-trash"
                            rendered="#{componentRenderer.hasPermission('PAYROLL_DEDUCTION_DELETE') and (row.status eq 'PENDING' or row.status eq 'PARTIAL' or row.status eq 'UNMATCHED')}"
                            title="Delete"
                            styleClass="ui-button-danger ui-button-outlined icon-action"
                            action="#{payrollDeductionView.delete(row)}"
                            update="@form" />
                    </div>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
