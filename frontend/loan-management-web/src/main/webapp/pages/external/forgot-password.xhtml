<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/pages/external/external-template.xhtml">
    <ui:define name="title">Recover account | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h2>Recover your account</h2>
        <p>Enter your registered email address or username.</p>
        <h:form id="recoveryForm">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <div class="field"><p:outputLabel for="account" value="Username or email"/><p:inputText id="account" value="#{passwordResetController.usernameOrEmail}" required="true"/></div>
            <p:commandButton value="Check account" icon="pi pi-search" styleClass="full-button" action="#{passwordResetController.requestReset}" update="recoveryForm"/>
            <div class="external-links"><h:link outcome="/pages/external/login" value="Back to login" styleClass="app-button app-button-secondary"/><h:link outcome="/pages/external/reset-password" value="Reset password"/></div>
        </h:form>
    </ui:define>
</ui:composition>
