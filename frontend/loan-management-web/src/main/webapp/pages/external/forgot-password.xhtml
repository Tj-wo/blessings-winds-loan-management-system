<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/pages/external/external-template.xhtml">
    <ui:define name="title">Reset password | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h2>Reset your password</h2>
        <p>Enter your registered email. We will send a six-digit verification code.</p>
        <h:form id="recoveryForm">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <div class="field"><p:outputLabel for="email" value="Email address"/><p:inputText id="email" type="email" value="#{passwordResetController.email}" required="true" readonly="#{passwordResetController.otpSent}"/></div>
            <p:commandButton rendered="#{not passwordResetController.otpSent}" value="Send verification code" icon="pi pi-envelope" styleClass="full-button" action="#{passwordResetController.requestOtp}" update="recoveryForm"/>
            <h:panelGroup rendered="#{passwordResetController.otpSent}" layout="block">
                <div class="field"><p:outputLabel for="otp" value="Six-digit verification code"/><p:inputText id="otp" value="#{passwordResetController.otp}" required="true" maxlength="6"/></div>
                <div class="field"><p:outputLabel for="password" value="New password"/><p:password id="password" value="#{passwordResetController.newPassword}" required="true" feedback="true" toggleMask="true"/></div>
                <div class="field"><p:outputLabel for="confirm" value="Confirm password"/><p:password id="confirm" value="#{passwordResetController.confirmPassword}" required="true" toggleMask="true"/></div>
                <p:commandButton value="Verify code and reset password" icon="pi pi-lock" styleClass="full-button" action="#{passwordResetController.resetPassword}" update="recoveryForm"/>
                <p:commandButton value="Resend code" process="@this email" action="#{passwordResetController.requestOtp}" update="recoveryForm" styleClass="ui-button-outlined full-button"/>
            </h:panelGroup>
            <div class="external-links"><h:link outcome="/pages/external/login" value="Back to login" styleClass="app-button app-button-secondary"/></div>
        </h:form>
    </ui:define>
</ui:composition>
