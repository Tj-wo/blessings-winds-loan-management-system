<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/external/external-template.xhtml">
    <ui:define name="title">Recover account | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h2>Recover your account</h2>
        <p>Enter your registered email address to receive reset instructions.</p>
        <h:form>
            <div class="field">
                <p:outputLabel for="email" value="Email address"/>
                <p:inputText id="email" type="email" required="true"/>
            </div>
            <p:commandButton value="Send reset link" icon="pi pi-envelope" styleClass="full-button"/>
            <div class="external-links">
                <h:link outcome="/pages/external/login" value="Back to sign in"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
