<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/external/external-template.xhtml">
    <ui:define name="title">Reset password | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h2>Create a new password</h2>
        <h:form>
            <div class="field">
                <p:outputLabel for="password" value="New password"/>
                <p:password id="password" required="true" feedback="true" toggleMask="true"/>
            </div>

            <div class="field">
                <p:outputLabel for="confirm" value="Confirm password"/>
                <p:password id="confirm" required="true" feedback="false" toggleMask="true"/>
            </div>
            <p:commandButton value="Reset password" icon="pi pi-lock" styleClass="full-button"/>
        </h:form>
    </ui:define>
</ui:composition>
