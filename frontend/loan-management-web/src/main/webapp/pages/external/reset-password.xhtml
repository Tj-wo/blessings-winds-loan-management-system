<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/pages/external/external-template.xhtml">
    <ui:define name="title">Reset password | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h2>Create a new password</h2>
        <p>Use your account email or username and choose a password with at least eight characters.</p>
        <h:form id="resetForm">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <div class="field"><p:outputLabel for="account" value="Username or email"/><p:inputText id="account" value="#{passwordResetController.usernameOrEmail}" required="true"/></div>
            <div class="field"><p:outputLabel for="password" value="New password"/><p:password id="password" value="#{passwordResetController.newPassword}" required="true" feedback="true" toggleMask="true"/></div>
            <div class="field"><p:outputLabel for="confirm" value="Confirm password"/><p:password id="confirm" value="#{passwordResetController.confirmPassword}" required="true" feedback="false" toggleMask="true"/></div>
            <p:commandButton value="Reset password" icon="pi pi-lock" styleClass="full-button" action="#{passwordResetController.resetPassword}" update="resetForm"/>
            <div class="external-links"><h:link outcome="/pages/external/login" value="Back to login" styleClass="app-button app-button-secondary"/></div>
        </h:form>
    </ui:define>
</ui:composition>
