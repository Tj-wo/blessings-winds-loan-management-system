<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        template="/pages/external/external-template.xhtml">
    <ui:define name="title">Employee onboarding | Blessed Winds Loans</ui:define>
    <ui:define name="content">
        <h2>Employee self-onboarding</h2>
        <p>Your registration will be attached to the company represented by this secure link.</p>
        <h:form enctype="multipart/form-data">
            <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
                <p:outputLabel for="first" value="First name"/>
                <p:inputText id="first" required="true"/>
                <p:outputLabel for="last" value="Last name"/>
                <p:inputText id="last" required="true"/>
                <p:outputLabel for="nationalId" value="National ID"/>
                <p:inputText id="nationalId" required="true"/>
                <p:outputLabel for="employeeNo" value="Employee number"/>
                <p:inputText id="employeeNo" required="true"/>
                <p:outputLabel for="payrollNo" value="Payroll number"/>
                <p:inputText id="payrollNo" required="true"/>
                <p:outputLabel for="phone" value="Phone"/>
                <p:inputText id="phone" required="true"/>
                <p:outputLabel for="email" value="Email"/>
                <p:inputText id="email" type="email"/>
                <p:outputLabel for="salary" value="Monthly salary (UGX)"/>
                <p:inputNumber id="salary" decimalPlaces="0" minValue="0"/>
            </p:panelGrid>
            <p:commandButton value="Continue to KYC" icon="pi pi-arrow-right" styleClass="full-button"/>
        </h:form>
    </ui:define>
</ui:composition>
