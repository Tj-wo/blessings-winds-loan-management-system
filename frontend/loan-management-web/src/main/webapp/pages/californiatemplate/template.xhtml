<!DOCTYPE html>
<html
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>
            <ui:insert name="title">Blessed Winds Loans</ui:insert>
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet library="primefaces" name="primeicons/primeicons.css"/>
        <h:outputStylesheet library="css" name="loan-management.css"/>
    </h:head>
    <h:body>
        <div class="layout-wrapper">
            <ui:include src="topbar.xhtml"/>
            <ui:include src="sidebar.xhtml"/>
            <button type="button" class="sidebar-backdrop" aria-label="Close navigation menu" onclick="return window.BWNavigation.close();"></button>
            <main class="layout-main">
                <ui:insert name="content"/>
            </main>
            <ui:include src="footer.xhtml"/>
        </div>
        <p:ajaxStatus>
            <f:facet xmlns:f="http://xmlns.jcp.org/jsf/core" name="start">
                <i class="pi pi-spin pi-spinner global-loader"/>
            </f:facet>
        </p:ajaxStatus>
        <script type="text/javascript">
            window.BWNavigation = {
                toggle: function(button) {
                    var open = document.body.classList.toggle('mobile-menu-open');
                    button.setAttribute('aria-expanded', open ? 'true' : 'false');
                    return false;
                },
                close: function() {
                    document.body.classList.remove('mobile-menu-open');
                    var button = document.querySelector('.mobile-menu-toggle');
                    if (button) button.setAttribute('aria-expanded', 'false');
                    return false;
                }
            };
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') window.BWNavigation.close();
            });
        </script>
    </h:body>
</html>
