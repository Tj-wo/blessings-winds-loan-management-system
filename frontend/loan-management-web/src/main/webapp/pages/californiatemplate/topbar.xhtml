<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui">
    <header class="layout-topbar">
        <div class="mobile-brand">
            <span class="brand-mark small">BW</span>
            <strong>Blessed Winds Loans</strong>
        </div>
        <h:form styleClass="topbar-search">
            <i class="pi pi-search" />
            <p:inputText placeholder="Search loans, employees and companies" />
        </h:form>
        <div class="topbar-actions">
            <h:form id="notificationBadgeForm">
                <h:panelGroup id="notificationIndicator" layout="block">
                    <h:link outcome="/pages/notification/NotificationView" title="Notifications" styleClass="notification-link">
                        <i class="pi pi-bell" />
                        <h:panelGroup layout="block" styleClass="notification-badge" rendered="#{notificationBadgeView.unreadCount gt 0}">#{notificationBadgeView.unreadCount}</h:panelGroup>
                    </h:link>
                </h:panelGroup>
                <p:poll interval="20" update="notificationIndicator" />
            </h:form>
            <h:link outcome="/pages/security/ProfileView" value="#{authenticationController.loggedInUser.displayName}" />
            <h:form>
                <p:commandButton
                    icon="pi pi-sign-out"
                    title="Sign out"
                    action="#{authenticationController.logout}"
                    styleClass="ui-button-text" />
            </h:form>
        </div>
    </header>
</ui:composition>
